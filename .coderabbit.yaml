# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI Code Review Configuration
# Fork repository: asabon/vajra

language: "ja-JP"
early_access: false

reviews:
  # レビュープロファイル: "chill" (主要な問題やバグにフォーカスし、過度な形式チェックを抑制)
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  tools:
    ast-grep:
      enabled: true

chat:
  auto_reply: true
